name: secret-scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks (free CLI; the gitleaks-action wrapper needs a paid org license)
        run: |
          VER=8.18.4
          ARCHIVE="gitleaks_${VER}_linux_x64.tar.gz"
          curl -sSL -O "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/${ARCHIVE}"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_checksums.txt" -o gl.sha256
          # Verify the downloaded archive against gitleaks' published checksums before
          # extracting/running it — closes an unverified-binary-execution gap in a job
          # that has repo-content read access. (Keeps the archive's real filename so
          # sha256sum -c can match it against the checksums file's own filename column.)
          grep " ${ARCHIVE}\$" gl.sha256 | sha256sum -c -
          tar -xzf "$ARCHIVE" gitleaks
          ./gitleaks detect --source . --redact --no-banner
